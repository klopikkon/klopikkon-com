name: Tesla Start Charge

# One-shot: check awake first; wake only if needed; charging-start at current limit.
# Does not change charge limit, amps, or Powerwall settings.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-charge:
    runs-on: ubuntu-latest
    steps:
      - name: Install PyNaCl
        run: pip install pynacl cryptography

      - name: Refresh access token
        id: token
        run: |
          set -euo pipefail
          RESPONSE=$(curl -s -X POST "https://fleet-auth.prd.vn.cloud.tesla.com/oauth2/v3/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "client_id=${{ secrets.TESLA_CLIENT_ID }}" \
            -d "refresh_token=${{ secrets.TESLA_REFRESH_TOKEN }}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)
          NEW_REFRESH=$(echo "$RESPONSE" | jq -r .refresh_token)
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to refresh token"
            exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$NEW_REFRESH" != "null" ] && [ -n "$NEW_REFRESH" ]; then
            cat > /tmp/encrypt.py << 'EOPY'
          from base64 import b64encode
          from nacl import encoding, public
          import sys
          public_key = public.PublicKey(sys.argv[1], encoding.Base64Encoder())
          print(b64encode(public.SealedBox(public_key).encrypt(sys.argv[2].encode())).decode())
          EOPY
            KEY_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/klopikkon/klopikkon-com/actions/secrets/public-key")
            KEY_ID=$(echo "$KEY_RESPONSE" | jq -r .key_id)
            PUBLIC_KEY=$(echo "$KEY_RESPONSE" | jq -r .key)
            ENCRYPTED=$(python3 /tmp/encrypt.py "$PUBLIC_KEY" "$NEW_REFRESH")
            HTTP=$(curl -s -o /tmp/secret-put.out -w "%{http_code}" -X PUT \
              -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/klopikkon/klopikkon-com/actions/secrets/TESLA_REFRESH_TOKEN" \
              -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}")
            echo "TESLA_REFRESH_TOKEN HTTP $HTTP"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build tesla-control
        run: |
          git clone --depth 1 https://github.com/teslamotors/vehicle-command.git /tmp/vehicle-command
          cd /tmp/vehicle-command
          go build -o "$HOME/go/bin/tesla-control" ./cmd/tesla-control
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Check awake, then start charge if plugged
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          TESLA_VEHICLE_ID: ${{ secrets.TESLA_VEHICLE_ID }}
          TESLA_PRIVATE_KEY: ${{ secrets.TESLA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BASE="https://fleet-api.prd.na.vn.cloud.tesla.com/api/1"
          umask 077
          printf '%s' "$TESLA_PRIVATE_KEY" > /tmp/tesla-private.pem
          printf '%s' "$TOKEN" > /tmp/tesla-token
          export TESLA_KEY_FILE=/tmp/tesla-private.pem
          export TESLA_TOKEN_FILE=/tmp/tesla-token
          export PATH="$PATH:$(go env GOPATH)/bin"

          VEHICLES=$(curl -sS "$BASE/vehicles" -H "Authorization: Bearer $TOKEN")
          VIN=$(echo "$VEHICLES" | jq -r --arg id "$TESLA_VEHICLE_ID" '.response[] | select((.id|tostring)==$id or (.vehicle_id|tostring)==$id or .display_name=="Spirit of Fire") | .vin' | head -1)
          if [ -z "$VIN" ] || [ "$VIN" = "null" ]; then
            echo "Could not resolve VIN"; exit 1
          fi
          export TESLA_VIN="$VIN"
          echo "VIN suffix ${VIN: -6}"

          STATE=$(echo "$VEHICLES" | jq -r --arg vin "$VIN" '.response[] | select(.vin==$vin) | .state' | head -1)
          echo "awake_check initial_state=$STATE"
          if [ "$STATE" = "online" ]; then
            echo "Already awake — skipping wake_up"
          else
            echo "Not awake ($STATE) — waking..."
            curl -sS -X POST "$BASE/vehicles/$VIN/wake_up" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' >/dev/null || true
            for i in 1 2 3 4 5 6 7 8; do
              STATE=$(curl -sS "$BASE/vehicles/$VIN" -H "Authorization: Bearer $TOKEN" | jq -r '.response.state // empty')
              echo "state=$STATE"
              [ "$STATE" = "online" ] && break
              sleep 8
            done
          fi

          DATA=$(curl -sS "$BASE/vehicles/$VIN/vehicle_data?endpoints=charge_state" -H "Authorization: Bearer $TOKEN")
          echo "$DATA" | jq '{charge_state:.response.charge_state.charging_state, limit:.response.charge_state.charge_limit_soc, soc:.response.charge_state.battery_level, amps:.response.charge_state.charger_actual_current}'
          CS=$(echo "$DATA" | jq -r '.response.charge_state.charging_state // "Unknown"')
          SOC=$(echo "$DATA" | jq -r '.response.charge_state.battery_level // "null"')
          LIMIT=$(echo "$DATA" | jq -r '.response.charge_state.charge_limit_soc // "null"')
          echo "BEFORE charge_state=$CS soc=$SOC limit=$LIMIT"

          if echo "$CS" | grep -Eiq '^Charging$'; then
            echo "RESULT=success already_charging charge_state=$CS soc=$SOC limit=$LIMIT"
            rm -f /tmp/tesla-private.pem /tmp/tesla-token
            exit 0
          fi

          if echo "$CS" | grep -Eiq 'disconnected|^$|unknown'; then
            echo "WARN Fleet says $CS — still sending charging-start (cable may be unseen by API)"
          fi

          set +e
          OUT=$(tesla-control charging-start 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -ne 0 ] && echo "$OUT" | grep -Eiq 'already_set|is_charging|complete|requested'; then RC=0; fi

          sleep 3
          DATA2=$(curl -sS "$BASE/vehicles/$VIN/vehicle_data?endpoints=charge_state" -H "Authorization: Bearer $TOKEN")
          echo "$DATA2" | jq '{charge_state:.response.charge_state.charging_state, limit:.response.charge_state.charge_limit_soc, soc:.response.charge_state.battery_level, amps:.response.charge_state.charger_actual_current}'
          CS2=$(echo "$DATA2" | jq -r '.response.charge_state.charging_state // "Unknown"')
          SOC2=$(echo "$DATA2" | jq -r '.response.charge_state.battery_level // "null"')
          LIMIT2=$(echo "$DATA2" | jq -r '.response.charge_state.charge_limit_soc // "null"')
          PLUGGED=true
          echo "$CS2" | grep -Eiq 'disconnected|^$|unknown' && PLUGGED=false

          if [ "$RC" -eq 0 ] || echo "$CS2" | grep -Eiq 'Charging|Starting|Complete'; then
            echo "RESULT=success plugged=$PLUGGED charge_state=$CS2 soc=$SOC2 limit=$LIMIT2"
            rm -f /tmp/tesla-private.pem /tmp/tesla-token
            exit 0
          fi
          echo "RESULT=fail plugged=$PLUGGED charge_state=$CS2 soc=$SOC2 limit=$LIMIT2 rc=$RC"
          rm -f /tmp/tesla-private.pem /tmp/tesla-token
          exit 1
