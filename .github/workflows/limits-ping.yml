name: Limits dashboard ping

# Browser on klopikkon.com/limits cannot POST api2.cursor.sh (CORS).
# Page dispatches this workflow; the runner curls the Grok Bot webhook.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Grok Bot limits webhook
        env:
          LIMITS_WEBHOOK_URL: ${{ secrets.LIMITS_WEBHOOK_URL }}
          LIMITS_WEBHOOK_TOKEN: ${{ secrets.LIMITS_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LIMITS_WEBHOOK_URL:-}" ]; then
            echo "Missing repo secret LIMITS_WEBHOOK_URL"
            exit 1
          fi
          if [ -z "${LIMITS_WEBHOOK_TOKEN:-}" ]; then
            echo "Missing repo secret LIMITS_WEBHOOK_TOKEN"
            exit 1
          fi
          HTTP=$(curl -sS -o /tmp/limits-ping.out -w "%{http_code}" -X POST "$LIMITS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LIMITS_WEBHOOK_TOKEN" \
            -d '{"event":"limits_refresh","source":"klopikkon.com/limits"}')
          echo "Webhook HTTP $HTTP"
          head -c 400 /tmp/limits-ping.out || true
          echo
          case "$HTTP" in
            2??) exit 0 ;;
            *) echo "Webhook failed"; exit 1 ;;
          esac
