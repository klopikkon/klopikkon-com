name: Update & Email Waikato MyMSD Jobs

on:
  schedule:
    # Runs daily at 19:47 UTC (8:47 AM NZDT / 7:47 AM NZST — off-peak minute for reliability)
    - cron: "47 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Fetch latest Waikato jobs
        run: python waikato-msd-jobs/fetch_msd_jobs.py --site-dir waikato-msd-jobs

      - name: Commit updated Excel, JSON, and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A waikato-msd-jobs/
          git diff --staged --quiet || git commit -m "Update Waikato MyMSD jobs ($(date -u +%Y-%m-%d))"
          git push

      - name: Email latest Waikato Jobs Excel
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'Waikato MSD Jobs <jobs@klopikkon.com>' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import smtplib
          import urllib.request
          from email.message import EmailMessage
          from pathlib import Path

          site_dir = Path("waikato-msd-jobs")
          meta = json.loads((site_dir / "jobs.json").read_text(encoding="utf-8"))
          excel_name = meta.get("excelFile", "")
          excel_path = site_dir / excel_name if excel_name else None

          if not excel_path or not excel_path.exists():
              matches = sorted(site_dir.glob("waikato_jobs*.xlsx"))
              if not matches:
                  raise FileNotFoundError("No waikato_jobs*.xlsx file found to email.")
              excel_path = matches[-1]
              excel_name = excel_path.name

          recipients = [r.strip() for r in os.environ.get("EMAIL_TO", "").split(",") if r.strip()]
          if not recipients:
              raise ValueError("Missing required secret: EMAIL_TO.")

          total = meta.get("total", "N/A")
          subject = f"Waikato Active MyMSD Jobs ({excel_name.removesuffix('.xlsx')})"
          body_text = (
              f"Kia ora,\n\n"
              f"Attached is the latest Waikato Region active MyMSD jobs spreadsheet ({total} active vacancies).\n"
              f"File: {excel_name}\n\n"
              f"You can also browse or search online at:\n"
              f"https://klopikkon.com/waikato-msd-jobs/\n"
          )
          file_bytes = excel_path.read_bytes()

          resend_key = os.environ.get("RESEND_API_KEY", "").strip()
          if resend_key:
              payload = json.dumps({
                  "from": os.environ["EMAIL_FROM"],
                  "to": recipients,
                  "subject": subject,
                  "text": body_text,
                  "attachments": [
                      {
                          "filename": excel_name,
                          "content": base64.b64encode(file_bytes).decode("ascii"),
                      }
                  ],
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.resend.com/emails",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {resend_key}",
                      "Content-Type": "application/json",
                      "User-Agent": "klopikkon-msd-jobs/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Resend response:", resp.read().decode("utf-8"))
              print(f"Sent {excel_name} ({total} jobs) via Resend to {', '.join(recipients)}")
          else:
              smtp_host = os.environ["SMTP_HOST"]
              smtp_port = int(os.environ["SMTP_PORT"])
              smtp_user = os.environ.get("SMTP_USERNAME", "").strip()
              smtp_pass = os.environ.get("SMTP_PASSWORD", "").strip()
              if not smtp_user or not smtp_pass:
                  raise ValueError("Set RESEND_API_KEY (recommended) or SMTP_USERNAME + SMTP_PASSWORD.")

              msg = EmailMessage()
              msg["Subject"] = subject
              msg["From"] = smtp_user
              msg["To"] = ", ".join(recipients)
              msg.set_content(body_text)
              msg.add_attachment(
                  file_bytes,
                  maintype="application",
                  subtype="vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                  filename=excel_name,
              )
              with smtplib.SMTP(smtp_host, smtp_port, timeout=30) as server:
                  server.starttls()
                  server.login(smtp_user, smtp_pass)
                  server.send_message(msg)
              print(f"Sent {excel_name} ({total} jobs) via SMTP to {', '.join(recipients)}")
          PY
