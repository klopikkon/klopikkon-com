name: Tesla Powerwall Schedule

# Surplus solar to car (plugged in, SoC<85%, Powerwall >=95%): 09:00-10:30 and 14:00-15:30, stop 16:00.
# 11:00 still sets 90% for the free grid window. 14:00 stops the free-window charge unless solar can take over.
# Car commands (Spirit of Fire) are signed with the klopikkon.com virtual key.
# One-time: in the Tesla app, open https://tesla.com/_ak/klopikkon.com and approve
# the key on Spirit of Fire. Australia uses the NA Fleet API (same as Powerwall).

on:
  schedule:
    # Times are UTC = AEST-10, fixed year-round (not Sydney DST).
    - cron: "0 18 * * *"      # 04:00 AEST overnight
    - cron: "0 19 * * *"      # 05:00 AEST
    - cron: "0 20 * * *"      # 06:00 AEST house mode
    - cron: "0,30 23,0-6 * * *"  # 09:00-16:30 AEST every 30 min
    - cron: "0 7 * * *"       # 17:00 AEST dashboard tick
  workflow_dispatch:
    inputs:
      force_hour:
        description: 'Override AEST hour (04, 09, 10, 11, 14, 15, 16). Empty = now.'
        required: false
        type: string
      status_only:
        description: 'Read-only dump of live_status and site_info. No writes.'
        required: false
        type: boolean
        default: false

jobs:
  powerwall:
    runs-on: ubuntu-latest
    steps:
      - name: Install PyNaCl
        run: pip install pynacl cryptography

      - name: Refresh access token and rotate refresh token
        id: token
        run: |
          RESPONSE=$(curl -s -X POST "https://fleet-auth.prd.vn.cloud.tesla.com/oauth2/v3/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "client_id=${{ secrets.TESLA_CLIENT_ID }}" \
            -d "refresh_token=${{ secrets.TESLA_REFRESH_TOKEN }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)
          NEW_REFRESH=$(echo "$RESPONSE" | jq -r .refresh_token)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to refresh token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

          if [ "$NEW_REFRESH" != "null" ] && [ -n "$NEW_REFRESH" ]; then
            echo "Updating TESLA_REFRESH_TOKEN secret..."

            KEY_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key")

            KEY_ID=$(echo "$KEY_RESPONSE" | jq -r .key_id)
            PUBLIC_KEY=$(echo "$KEY_RESPONSE" | jq -r .key)

            # Write a small Python script to a file to avoid YAML quoting problems
            cat > /tmp/encrypt.py << 'EOF'
          from base64 import b64encode
          from nacl import encoding, public
          import sys
          public_key = public.PublicKey(sys.argv[1], encoding.Base64Encoder())
          sealed_box = public.SealedBox(public_key)
          encrypted = sealed_box.encrypt(sys.argv[2].encode("utf-8"))
          print(b64encode(encrypted).decode("utf-8"))
          EOF

            ENCRYPTED=$(python3 /tmp/encrypt.py "$PUBLIC_KEY" "$NEW_REFRESH")

            curl -s -X PUT \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/TESLA_REFRESH_TOKEN" \
              -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}"

            echo "TESLA_REFRESH_TOKEN secret updated successfully"
          fi

      - name: Determine action based on time
        id: action
        run: |
          HOUR=$(TZ='Australia/Sydney' date +%H)
          MIN=$(TZ='Australia/Sydney' date +%M)
          FORCE="${{ github.event.inputs.force_hour }}"
          if [ -n "$FORCE" ]; then
            HOUR=$(printf '%02d' "$((10#$FORCE))")
            echo "Forced AEST hour: $HOUR (clock was $(TZ='Australia/Sydney' date +%H:%M))"
          else
            echo "Current AEST time: $HOUR:$MIN"
          fi
          echo "hour=$HOUR" >> $GITHUB_OUTPUT
          echo "minute=$MIN" >> $GITHUB_OUTPUT

      - name: Run Powerwall command
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          SITE: ${{ secrets.ENERGY_SITE_ID }}
          HOUR: ${{ steps.action.outputs.hour }}
          MIN: ${{ steps.action.outputs.minute }}
          FORCE: ${{ github.event.inputs.force_hour }}
          STATUS_ONLY: ${{ github.event.inputs.status_only }}
        run: |
          BASE="https://fleet-api.prd.na.vn.cloud.tesla.com/api/1/energy_sites/$SITE"

          echo "=== live_status ==="
          curl -sS "$BASE/live_status" -H "Authorization: Bearer $TOKEN" | jq '{solar:.response.solar_power, grid:.response.grid_power, battery:.response.battery_power, load:.response.load_power, pw:.response.percentage_charged, grid_status:.response.grid_status}'
          echo "=== site_info ==="
          curl -sS "$BASE/site_info" -H "Authorization: Bearer $TOKEN" | jq '{mode:.response.default_real_mode, reserve:.response.backup_reserve_percent, disallow_grid:.response.disallow_charge_from_grid_with_solar_installed}'

          if [ "$STATUS_ONLY" = "true" ]; then
            echo "status_only: no Powerwall writes"
            exit 0
          fi

          set_backup() {
            curl -s -X POST "$BASE/backup" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"backup_reserve_percent\": $1}"
            echo "Set backup reserve to $1%"
          }

          set_mode() {
            curl -s -X POST "$BASE/operation" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"default_real_mode\": \"$1\"}"
            echo "Set mode to $1"
          }

          set_grid_charging() {
            curl -s -X POST "$BASE/grid_import_export" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"disallow_charge_from_grid_with_solar_installed\": $1}"
            echo "Grid charging disallow = $1"
          }

          get_soc() {
            curl -s "$BASE/live_status" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.response.percentage_charged'
          }

          if [ "$MIN" != "00" ] && [ -z "$FORCE" ]; then
            echo "Half-hour tick $HOUR:$MIN — skip Powerwall writes"
          else
          case $HOUR in
            04)
              SOC=$(get_soc)
              echo "Current SoC: $SOC%"
              if (( $(echo "$SOC < 40" | bc -l) )); then
                echo "SoC under 40% → starting charge to 60%"
                set_mode "backup"
                set_grid_charging false
                set_backup 60
              else
                echo "SoC already ≥ 40% → doing nothing"
              fi
              ;;
            05)
              echo "05:00 status check"
              get_soc
              ;;
            06)
              echo "06:00 → house mode + stop grid charging"
              set_mode "self_consumption"
              set_grid_charging true
              set_backup 5
              ;;
            11)
              echo "11:00 → free fill + allow grid charging"
              set_mode "backup"
              set_grid_charging false
              set_backup 100
              ;;
            12|13)
              echo "$HOUR:00 status check"
              get_soc
              ;;
            14)
              echo "14:00 → Self-Powered + stop grid charging"
              set_mode "self_consumption"
              set_grid_charging true
              set_backup 5
              ;;
            *)
              echo "Unexpected hour $HOUR – no action"
              ;;
          esac
          fi

      - name: Publish encrypted dashboard
        if: success()
        continue-on-error: true
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          SITE: ${{ secrets.ENERGY_SITE_ID }}
          TESLA_VEHICLE_ID: ${{ secrets.TESLA_VEHICLE_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ENERGY_DASH_PASSWORD: ${{ secrets.ENERGY_DASH_PASSWORD }}
          ENERGY_DASH_SALT: b60c6ce5d89b77d89f96039a6df27031
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$ENERGY_DASH_PASSWORD" ]; then echo "no dashboard password"; exit 0; fi
          curl -sS -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/energy/publish.py?ref=main" -o /tmp/publish.py
          python3 /tmp/publish.py

      - name: Install tesla-control
        if: github.event.inputs.status_only != 'true' && contains(fromJSON('["09","10","11","14","15","16"]'), steps.action.outputs.hour)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build tesla-control
        if: github.event.inputs.status_only != 'true' && contains(fromJSON('["09","10","11","14","15","16"]'), steps.action.outputs.hour)
        run: |
          git clone --depth 1 https://github.com/teslamotors/vehicle-command.git /tmp/vehicle-command
          cd /tmp/vehicle-command
          go build -o "$HOME/go/bin/tesla-control" ./cmd/tesla-control
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/tesla-control" --help | head -20

      - name: Spirit of Fire charge limit
        if: github.event.inputs.status_only != 'true' && contains(fromJSON('["09","10","11","14","15","16"]'), steps.action.outputs.hour)
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          HOUR: ${{ steps.action.outputs.hour }}
          SITE: ${{ secrets.ENERGY_SITE_ID }}
          TESLA_VEHICLE_ID: ${{ secrets.TESLA_VEHICLE_ID }}
          TESLA_PRIVATE_KEY: ${{ secrets.TESLA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BASE="https://fleet-api.prd.na.vn.cloud.tesla.com/api/1"
          umask 077
          printf '%s' "$TESLA_PRIVATE_KEY" > /tmp/tesla-private.pem
          printf '%s' "$TOKEN" > /tmp/tesla-token
          export TESLA_KEY_FILE=/tmp/tesla-private.pem
          export TESLA_TOKEN_FILE=/tmp/tesla-token
          export PATH="$PATH:$(go env GOPATH)/bin"

          VEHICLES=$(curl -sS "$BASE/vehicles" -H "Authorization: Bearer $TOKEN")
          VIN=$(echo "$VEHICLES" | jq -r --arg id "$TESLA_VEHICLE_ID" '.response[] | select((.id|tostring)==$id or (.vehicle_id|tostring)==$id or .display_name=="Spirit of Fire") | .vin' | head -1)
          if [ -z "$VIN" ] || [ "$VIN" = "null" ]; then
            echo "Could not resolve VIN for Spirit of Fire / id $TESLA_VEHICLE_ID"
            echo "$VEHICLES" | jq '{count:(.response|length), names:[.response[].display_name]}'
            exit 1
          fi
          echo "VIN suffix ${VIN: -6}"
          export TESLA_VIN="$VIN"

          echo "Waking vehicle..."
          curl -sS -X POST "$BASE/vehicles/$VIN/wake_up" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' >/dev/null || true
          curl -sS -X POST "$BASE/vehicles/$TESLA_VEHICLE_ID/wake_up" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}' >/dev/null || true
          for i in 1 2 3 4 5 6; do
            STATE=$(curl -sS "$BASE/vehicles/$VIN" -H "Authorization: Bearer $TOKEN" | jq -r '.response.state // empty')
            echo "state=$STATE"
            [ "$STATE" = "online" ] && break
            sleep 10
          done

          set_limit() {
            local pct="$1"
            set +e
            OUT=$(tesla-control charging-set-limit "$pct" 2>&1)
            RC=$?
            set -e
            echo "$OUT"
            if [ "$RC" -eq 0 ]; then
              return 0
            fi
            if echo "$OUT" | grep -qi 'already_set'; then
              echo "Charge limit already ${pct}% (signed command accepted)"
              return 0
            fi
            return "$RC"
          }

          tesla_ok() {
            set +e
            OUT=$(tesla-control "$@" 2>&1)
            RC=$?
            set -e
            echo "$OUT"
            if [ "$RC" -eq 0 ]; then return 0; fi
            echo "$OUT" | grep -Eiq 'already_set|is_charging|complete|requested|not_charging|disconnected|no_power' && return 0
            return "$RC"
          }

          LIVE=$(curl -sS "$BASE/energy_sites/$SITE/live_status" -H "Authorization: Bearer $TOKEN")
          echo "$LIVE" | jq '{solar:.response.solar_power, grid:.response.grid_power, battery:.response.battery_power, load:.response.load_power, pw:.response.percentage_charged}'

          DATA=$(curl -sS "$BASE/vehicles/$VIN/vehicle_data?endpoints=charge_state" -H "Authorization: Bearer $TOKEN")
          echo "$DATA" | jq '{soc:.response.charge_state.battery_level, state:.response.charge_state.charging_state, limit:.response.charge_state.charge_limit_soc, amps:.response.charge_state.charger_actual_current, volts:.response.charge_state.charger_voltage, phases:.response.charge_state.charger_phases}'

          if [ "$HOUR" = "11" ]; then
            echo "11:00 → free window, charge limit 90%"
            set_limit 90
            tesla_ok charging-start || true
            rm -f /tmp/tesla-private.pem /tmp/tesla-token
            exit 0
          fi

          echo '' | base64 -d > /tmp/solar_plan.py
          printf '%s' "$LIVE" > /tmp/live.json
          printf '%s' "$DATA" > /tmp/car.json
          PLAN=$(python3 /tmp/solar_plan.py "$HOUR" /tmp/live.json /tmp/car.json)
          echo "$PLAN"
          ACTION=$(echo "$PLAN" | jq -r .action)
          REASON=$(echo "$PLAN" | jq -r .reason)
          echo "plan=$ACTION $REASON"

          case "$ACTION" in
            solar)
              AMPS=$(echo "$PLAN" | jq -r .amps)
              set_limit 85
              tesla_ok charging-set-amps "$AMPS"
              tesla_ok charging-start || true
              echo "Solar divert: ${AMPS}A to 85%"
              ;;
            stop_free)
              LIMIT=$(echo "$PLAN" | jq -r .limit)
              set_limit "$LIMIT"
              tesla_ok charging-stop || true
              echo "Ended free-window charge, limit $LIMIT%"
              ;;
            stop)
              tesla_ok charging-stop || true
              echo "Stopped car charging ($REASON)"
              ;;
            skip)
              echo "No car action ($REASON)"
              ;;
            *)
              echo "Planner error: $PLAN"
              exit 1
              ;;
          esac
          rm -f /tmp/tesla-private.pem /tmp/tesla-token
