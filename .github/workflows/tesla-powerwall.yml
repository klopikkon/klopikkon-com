name: Tesla Powerwall Schedule

# Timer is cron-job.org workflow_dispatch only. GitHub on.schedule is off.
# Surplus solar to car (plugged in, SoC<85%, Powerwall >=95%): 09:00-10:30 and 14:00-15:30, stop 16:00.
# 11:00 sets 90% and 20A for the free grid window. 14:00 stops the free-window charge unless solar can take over.
# Wake gate: 11 and 16 always. 09/10/14/15 only if already online, or last poll plugged AND PW>=95% and export>=1150W.
# Last plug state is stored in energy/car_presence.json (no Tesla location API).
# Car commands (Spirit of Fire) are signed with the klopikkon.com virtual key.

on:
  workflow_dispatch:
    inputs:
      force_hour:
        description: 'Override AEST hour (04, 09, 10, 11, 14, 15, 16). Empty = now.'
        required: false
        type: string
      status_only:
        description: 'Read-only dump of live_status and site_info. No writes.'
        required: false
        type: boolean
        default: false

jobs:
  powerwall:
    runs-on: ubuntu-latest
    steps:
      - name: Install PyNaCl
        run: pip install pynacl cryptography

      - name: Refresh access token and rotate refresh token
        id: token
        run: |
          RESPONSE=$(curl -s -X POST "https://fleet-auth.prd.vn.cloud.tesla.com/oauth2/v3/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "client_id=${{ secrets.TESLA_CLIENT_ID }}" \
            -d "refresh_token=${{ secrets.TESLA_REFRESH_TOKEN }}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)
          NEW_REFRESH=$(echo "$RESPONSE" | jq -r .refresh_token)
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to refresh token"
            echo "$RESPONSE"
            exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          if [ "$NEW_REFRESH" != "null" ] && [ -n "$NEW_REFRESH" ]; then
            echo "Updating TESLA_REFRESH_TOKEN on klopikkon-com and tesla-powerwall-cron..."
            cat > /tmp/encrypt.py << 'EOF'
          from base64 import b64encode
          from nacl import encoding, public
          import sys
          public_key = public.PublicKey(sys.argv[1], encoding.Base64Encoder())
          sealed_box = public.SealedBox(public_key)
          encrypted = sealed_box.encrypt(sys.argv[2].encode("utf-8"))
          print(b64encode(encrypted).decode("utf-8"))
          EOF
            for SECRET_REPO in klopikkon/klopikkon-com klopikkon/tesla-powerwall-cron; do
              KEY_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${SECRET_REPO}/actions/secrets/public-key")
              KEY_ID=$(echo "$KEY_RESPONSE" | jq -r .key_id)
              PUBLIC_KEY=$(echo "$KEY_RESPONSE" | jq -r .key)
              if [ "$KEY_ID" = "null" ] || [ -z "$KEY_ID" ]; then
                echo "WARN: no actions public key for $SECRET_REPO"
                continue
              fi
              ENCRYPTED=$(python3 /tmp/encrypt.py "$PUBLIC_KEY" "$NEW_REFRESH")
              HTTP=$(curl -s -o /tmp/secret-put.out -w "%{http_code}" -X PUT \
                -H "Authorization: token ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${SECRET_REPO}/actions/secrets/TESLA_REFRESH_TOKEN" \
                -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}")
              echo "TESLA_REFRESH_TOKEN on $SECRET_REPO HTTP $HTTP"
            done
          fi

      - name: Determine action based on time
        id: action
        run: |
          HOUR=$(TZ='Australia/Sydney' date +%H)
          MIN=$(TZ='Australia/Sydney' date +%M)
          FORCE="${{ github.event.inputs.force_hour }}"
          if [ -n "$FORCE" ]; then
            HOUR=$(printf '%02d' "$((10#$FORCE))")
            echo "Forced AEST hour: $HOUR (clock was $(TZ='Australia/Sydney' date +%H:%M))"
          else
            echo "Current AEST time: $HOUR:$MIN"
          fi
          echo "hour=$HOUR" >> $GITHUB_OUTPUT
          echo "minute=$MIN" >> $GITHUB_OUTPUT

      - name: Run Powerwall command
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          SITE: ${{ secrets.ENERGY_SITE_ID }}
          HOUR: ${{ steps.action.outputs.hour }}
          MIN: ${{ steps.action.outputs.minute }}
          FORCE: ${{ github.event.inputs.force_hour }}
          STATUS_ONLY: ${{ github.event.inputs.status_only }}
        run: |
          BASE="https://fleet-api.prd.na.vn.cloud.tesla.com/api/1/energy_sites/$SITE"
          echo "=== live_status ==="
          curl -sS "$BASE/live_status" -H "Authorization: Bearer $TOKEN" | jq '{solar:.response.solar_power, grid:.response.grid_power, battery:.response.battery_power, load:.response.load_power, pw:.response.percentage_charged, grid_status:.response.grid_status}'
          echo "=== site_info ==="
          curl -sS "$BASE/site_info" -H "Authorization: Bearer $TOKEN" | jq '{mode:.response.default_real_mode, reserve:.response.backup_reserve_percent, disallow_grid:.response.disallow_charge_from_grid_with_solar_installed}'
          if [ "$STATUS_ONLY" = "true" ]; then
            echo "status_only: no Powerwall writes"
            exit 0
          fi
          set_backup() {
            curl -s -X POST "$BASE/backup" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"backup_reserve_percent\": $1}"
            echo "Set backup reserve to $1%"
          }
          set_mode() {
            curl -s -X POST "$BASE/operation" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"default_real_mode\": \"$1\"}"
            echo "Set mode to $1"
          }
          set_grid_charging() {
            curl -s -X POST "$BASE/grid_import_export" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"disallow_charge_from_grid_with_solar_installed\": $1}"
            echo "Grid charging disallow = $1"
          }
          get_soc() {
            curl -s "$BASE/live_status" -H "Authorization: Bearer $TOKEN" | jq -r '.response.percentage_charged'
          }
          if [ "$MIN" -ge 15 ] && [ -z "$FORCE" ]; then
            echo "Half-hour/late tick $HOUR:$MIN — skip Powerwall writes"
          else
          case $HOUR in
            04)
              SOC=$(get_soc)
              echo "Current SoC: $SOC%"
              if (( $(echo "$SOC < 40" | bc -l) )); then
                set_mode "backup"; set_grid_charging false; set_backup 60
              else
                echo "SoC already >= 40% → doing nothing"
              fi
              ;;
            05)
              echo "05:00 status check"; get_soc
              ;;
            06)
              set_mode "self_consumption"; set_grid_charging true; set_backup 5
              ;;
            11)
              set_mode "backup"; set_grid_charging false; set_backup 100
              ;;
            12|13)
              echo "$HOUR:00 status check"; get_soc
              ;;
            14)
              set_mode "self_consumption"; set_grid_charging true; set_backup 5
              ;;
            *)
              echo "Unexpected hour $HOUR – no action"
              ;;
          esac
          fi

      - name: Publish encrypted dashboard
        if: success()
        continue-on-error: true
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          SITE: ${{ secrets.ENERGY_SITE_ID }}
          TESLA_VEHICLE_ID: ${{ secrets.TESLA_VEHICLE_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ENERGY_DASH_PASSWORD: ${{ secrets.ENERGY_DASH_PASSWORD }}
          ENERGY_DASH_SALT: b60c6ce5d89b77d89f96039a6df27031
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$ENERGY_DASH_PASSWORD" ]; then echo "no dashboard password"; exit 0; fi
          curl -sS -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/energy/publish.py?ref=main" -o /tmp/publish.py
          python3 /tmp/publish.py

      - name: Install tesla-control
        if: github.event.inputs.status_only != 'true' && contains(fromJSON('["09","10","11","14","15","16"]'), steps.action.outputs.hour)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build tesla-control
        if: github.event.inputs.status_only != 'true' && contains(fromJSON('["09","10","11","14","15","16"]'), steps.action.outputs.hour)
        run: |
          git clone --depth 1 https://github.com/teslamotors/vehicle-command.git /tmp/vehicle-command
          cd /tmp/vehicle-command
          go build -o "$HOME/go/bin/tesla-control" ./cmd/tesla-control
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Spirit of Fire charge limit
        if: github.event.inputs.status_only != 'true' && contains(fromJSON('["09","10","11","14","15","16"]'), steps.action.outputs.hour)
        env:
          TOKEN: ${{ steps.token.outputs.access_token }}
          HOUR: ${{ steps.action.outputs.hour }}
          SITE: ${{ secrets.ENERGY_SITE_ID }}
          TESLA_VEHICLE_ID: ${{ secrets.TESLA_VEHICLE_ID }}
          TESLA_PRIVATE_KEY: ${{ secrets.TESLA_PRIVATE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          curl -sS -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/energy/car_step.sh?ref=main" -o /tmp/car_step.sh
          bash /tmp/car_step.sh
