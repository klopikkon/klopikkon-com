<!doctype html>
<html lang="en-AU">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" content="#140e0c">
<title>Hello</title>
<style>
:root{
  color-scheme:dark;
  --bg:#140e0c;
  --ink:#f4eadc;
  --muted:#b39a82;
  --ember:#e08a4c;
  --ember-deep:#c46a38;
  --line:#3d2a22;
  --field:#2a1c16;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{
  font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 520px at 50% -8%, rgba(224,138,76,.22), transparent 58%),
    radial-gradient(700px 400px at 80% 110%, rgba(90,40,20,.35), transparent 50%),
    var(--bg);
  color:var(--ink);
  padding:max(1.75rem, env(safe-area-inset-top)) max(1.4rem, env(safe-area-inset-right)) max(2.4rem, env(safe-area-inset-bottom)) max(1.4rem, env(safe-area-inset-left));
}
.ember{
  width:.55rem;height:.55rem;border-radius:50%;
  background:var(--ember);
  box-shadow:0 0 18px 6px rgba(224,138,76,.45);
  margin:0 auto 1.6rem;
}
#lock{
  min-height:calc(100dvh - 4rem);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
form{
  width:min(100%, 22rem);
  display:flex;flex-direction:column;gap:.95rem;
}
input{
  font:inherit;font-size:1rem;
  padding:.95rem 1rem;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(20,12,10,.45);
  color:var(--ink);
  outline:none;
  width:100%;
}
input:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(224,138,76,.18)}
button{
  font:inherit;font-weight:650;
  padding:.95rem 1rem;
  border:0;border-radius:999px;
  background:linear-gradient(180deg,#e79a5c,#c46a38);
  color:#1a100c;
  cursor:pointer;
}
button:active{transform:translateY(1px)}
.err{color:#e08a4c;min-height:1.3em;margin:0;font-size:.9rem;text-align:center}
#page{max-width:36rem;margin:0 auto;padding-top:.4rem}
#page .ember{margin:0 0 1.8rem}
h1{
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(2.05rem, 8.4vw, 3.15rem);
  line-height:1.12;
  letter-spacing:-.02em;
  margin:0;
}
.subtitle{
  color:var(--muted);
  margin:.55rem 0 0;
  font-size:.98rem;
  letter-spacing:.02em;
}
.rule{
  height:1px;width:4.2rem;
  background:linear-gradient(90deg,var(--ember),transparent);
  margin:1.55rem 0 0;
}
section{margin-top:2.15rem}
h2{
  font-size:.72rem;
  font-weight:650;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ember);
  margin:0 0 .75rem;
}
#page p{
  margin:0 0 1.05rem;
  font-size:1.05rem;
  color:#eadccb;
}
#page p:last-child{margin-bottom:0}
@media (prefers-reduced-motion:no-preference){
  #page{animation:rise .65s ease}
}
@keyframes rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
</style>
<body>
<div id="lock">
  <div class="ember" aria-hidden="true"></div>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button type="submit">Unlock</button>
    <p class="err" id="err"></p>
  </form>
</div>
<div id="page" hidden></div>
<script>
const SALT_HEX = "342baf1ef77cddb252b25a469e4dd1ae";
const LS = "hello-page-pw";
function hexToBytes(h){
  const a=new Uint8Array(h.length/2);
  for(let i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16);
  return a;
}
function b64ToBytes(s){
  const bin=atob(s.trim());
  const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
async function deriveKey(password){
  const enc=new TextEncoder();
  const material=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:hexToBytes(SALT_HEX),iterations:100000,hash:"SHA-256"},
    material,
    {name:"AES-GCM",length:256},
    false,
    ["decrypt"]
  );
}
async function load(password){
  const res=await fetch("page.enc?t="+Date.now(),{cache:"no-store"});
  if(!res.ok) throw new Error("Nothing to open.");
  const buf=b64ToBytes(await res.text());
  const pt=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv:buf.slice(0,12)},
    await deriveKey(password),
    buf.slice(12)
  );
  return JSON.parse(new TextDecoder().decode(pt));
}
function el(tag, cls, text){
  const n=document.createElement(tag);
  if(cls) n.className=cls;
  if(text!=null) n.textContent=text;
  return n;
}
function render(d){
  document.title=d.title||"Hello";
  const page=document.getElementById("page");
  page.replaceChildren();
  const ember=el("div","ember");
  ember.setAttribute("aria-hidden","true");
  page.append(ember, el("h1",null,d.title||""), el("p","subtitle",d.subtitle||""), el("div","rule"));
  for(const s of d.sections||[]){
    const sec=el("section");
    sec.append(el("h2",null,s.heading||""));
    for(const para of s.body||[]) sec.append(el("p",null,para));
    page.append(sec);
  }
  document.getElementById("lock").hidden=true;
  page.hidden=false;
}
async function unlock(password){
  const err=document.getElementById("err");
  err.textContent="";
  try{
    render(await load(password));
    localStorage.setItem(LS,password);
  }catch(e){
    localStorage.removeItem(LS);
    err.textContent=e.name==="OperationError"?"That didn't work.":String(e.message||e);
    throw e;
  }
}
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  unlock(document.getElementById("pw").value).catch(()=>{});
});
(async ()=>{
  const hash=decodeURIComponent((location.hash||"").replace(/^#/,""));
  if(location.hash){
    history.replaceState(null,"",location.pathname+location.search);
  }
  if(hash){
    try{ await unlock(hash); return; }catch(e){}
  }
  const saved=localStorage.getItem(LS);
  if(saved){
    try{ await unlock(saved); return; }catch(e){}
  }
})();
</script>
</body>
</html>
